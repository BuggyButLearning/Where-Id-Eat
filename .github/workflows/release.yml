name: Release skill packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach packages to"
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build packages
        run: |
          python tools/package_skills.py
          cp dist/claude/where-id-eat.zip where-id-eat-claude.zip
          cp dist/chatgpt/where-id-eat.zip where-id-eat-chatgpt.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" where-id-eat-claude.zip where-id-eat-chatgpt.zip --clobber
